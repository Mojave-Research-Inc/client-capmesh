# Resilience hardening (2026-06-27): the refresh.service sends SIGHUP to the
# server every 5min to trigger reindex. Python exits on SIGHUP, which systemd
# records as a clean stop, so Restart=on-failure did NOT bring it back -> the
# service drifted to inactive and the VIP went 502. Restart=always restarts on
# ANY exit (clean or failed), so a stray SIGHUP, a crash, or a failed deploy
# cannot leave capmesh down. StartLimit widened so restarts cannot trip the
# burst limit and wedge the unit in a failed state.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=20

[Service]
Restart=always
RestartSec=5
