# Allow outbound to Microsoft Entra ID (login.microsoftonline.com) so
# /api/v1/auth/m365/* (device-code, browser, poll, token exchange) does not
# hang/fail with 'Network is unreachable' under the IPAddressDeny=any
# sandbox in the base unit (which otherwise only permits localhost +
# Tailscale CIDRs). Ranges below are the subnets covering
# login.microsoftonline.com's current resolved addresses and are listed
# under Microsoft's published 'AzureActiveDirectory' service tag
# (https://www.microsoft.com/en-us/download/details.aspx?id=56519).
# Hostname-based IPAddressAllow=login.microsoftonline.com was tried first
# but systemd rejected it at load time ('Invalid address prefix'), so
# static ranges are used instead.
[Service]
IPAddressAllow=20.190.128.0/18 40.126.0.0/18 2603:1036:3000::/48 2603:1037:1::/48
