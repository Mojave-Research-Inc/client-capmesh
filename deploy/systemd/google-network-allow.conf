# Allow outbound to Google's OAuth/OIDC endpoints so
# /api/v1/auth/google/callback (exchange_code_for_tokens against
# oauth2.googleapis.com, and verify_google_id_token's fetch of Google's
# public-cert/JWKS endpoint) does not fail with 'Network is unreachable'
# under the IPAddressDeny=any sandbox in the base unit (which otherwise
# only permits localhost + Tailscale CIDRs). Same pattern and rationale as
# entra-network-allow.conf.
#
# Google does not publish a narrow per-service tag the way Microsoft
# publishes 'AzureActiveDirectory'. These ranges were derived by resolving
# oauth2.googleapis.com, accounts.google.com, www.googleapis.com, and
# login.googleapis.com and matching the results against Google's official
# published service-range list (https://www.gstatic.com/ipranges/goog.json)
# to find the smallest containing prefixes, rather than allow-listing all of
# Google's published ranges (goog.json lists ~100 prefixes covering every
# Google product). Re-derive periodically: Google's IPs for these hostnames
# can shift within these prefixes but are not guaranteed to stay within them
# forever.
[Service]
IPAddressAllow=142.250.0.0/15 172.253.0.0/16 216.239.32.0/19 2001:4860::/32 2607:f8b0::/32
